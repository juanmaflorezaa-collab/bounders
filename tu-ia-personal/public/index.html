<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tu IA personal</title>
<style>
  :root {
    --bg: #f5f4f1; --surface: #fff; --text: #1a1a1a; --muted: #6b6b6b;
    --accent: #2b2b2b; --bubble-user: #2b2b2b; --bubble-user-text: #fff;
    --bubble-ai: #eeece8; --border: #e2e0da;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17171a; --surface:#1f1f23; --text:#f0efec; --muted:#9a9a9a;
      --accent:#f0efec; --bubble-user:#f0efec; --bubble-user-text:#17171a;
      --bubble-ai:#2a2a2e; --border:#303035; }
  }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column;
    background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:16px 20px; border-bottom:1px solid var(--border); background:var(--surface); }
  header h1 { margin:0; font-size:1.1rem; }
  header p { margin:2px 0 0; font-size:0.8rem; color:var(--muted); }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; max-width:640px; margin:0 auto; width:100%; }
  .msg { max-width:80%; padding:10px 14px; border-radius:16px; line-height:1.4; font-size:0.95rem; white-space:pre-wrap; word-wrap:break-word; }
  .msg.user { align-self:flex-end; background:var(--bubble-user); color:var(--bubble-user-text); border-bottom-right-radius:4px; }
  .msg.ai { align-self:flex-start; background:var(--bubble-ai); color:var(--text); border-bottom-left-radius:4px; }
  .msg.typing { align-self:flex-start; background:var(--bubble-ai); color:var(--muted); font-style:italic; }
  form#composer { display:flex; gap:8px; padding:12px; border-top:1px solid var(--border); background:var(--surface); max-width:640px; margin:0 auto; width:100%; }
  #input { flex:1; border:1px solid var(--border); border-radius:20px; padding:10px 16px; font-size:0.95rem; background:var(--bg); color:var(--text); outline:none; }
  #send { border:none; background:var(--accent); color:var(--bg); border-radius:20px; padding:0 18px; font-weight:600; cursor:pointer; }
  #send:disabled { opacity:0.5; cursor:default; }
  #mic { border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:50%; width:40px; height:40px; font-size:1.1rem; cursor:pointer; flex-shrink:0; }
  #mic.listening { background:#c0392b; color:#fff; border-color:#c0392b; }
  #notice { max-width:640px; margin:8px auto 0; padding:0 16px; font-size:0.78rem; color:var(--muted); text-align:center; }
  #voiceToggle { font-size:0.78rem; color:var(--muted); text-align:center; max-width:640px; margin:4px auto 0; }

  #authScreen { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; }
  #authBox { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; width:100%; max-width:340px; }
  #authBox h2 { margin:0 0 4px; font-size:1.1rem; }
  #authBox p.sub { margin:0 0 18px; font-size:0.82rem; color:var(--muted); }
  #authBox input { width:100%; margin-bottom:10px; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:0.9rem; }
  #authBox button { width:100%; padding:10px; border-radius:10px; border:none; background:var(--accent); color:var(--bg); font-weight:600; cursor:pointer; margin-top:4px; }
  #authBox .switch { text-align:center; font-size:0.82rem; color:var(--muted); margin-top:14px; }
  #authBox .switch a { color:var(--text); cursor:pointer; text-decoration:underline; }
  #authError { color:#c0392b; font-size:0.8rem; margin-top:8px; min-height:1em; }
  #topbar { display:flex; justify-content:flex-end; padding:8px 16px; max-width:640px; margin:0 auto; width:100%; }
  #topbar button { background:none; border:none; color:var(--muted); font-size:0.78rem; cursor:pointer; text-decoration:underline; }
  .hidden { display:none !important; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<header>
  <h1>Tu IA personal</h1>
  <p>Versión independiente — voz, texto y memoria</p>
</header>

<div id="topbar" class="hidden"><button id="logoutBtn">Cerrar sesión</button></div>

<div id="authScreen">
  <div id="authBox">
    <h2 id="authTitle">Inicia sesión</h2>
    <p class="sub">Tu memoria se guarda ligada a tu cuenta.</p>
    <input id="authEmail" type="email" placeholder="Email" autocomplete="email" />
    <input id="authPassword" type="password" placeholder="Contraseña (mín. 6 caracteres)" autocomplete="current-password" />
    <button id="authSubmit">Entrar</button>
    <div id="authError"></div>
    <p class="switch">¿No tienes cuenta? <a id="authSwitch">Regístrate</a></p>
  </div>
</div>

<div id="chat" class="hidden"></div>
<div id="notice"></div>
<div id="voiceToggle" class="hidden"><label><input type="checkbox" id="speakToggle" checked /> Leer respuestas en voz alta</label></div>

<form id="composer" class="hidden">
  <button id="mic" type="button" title="Hablar">🎤</button>
  <input id="input" type="text" placeholder="Escribe tu mensaje..." autocomplete="off" />
  <button id="send" type="submit">Enviar</button>
</form>

<script>
  // --- Configuración de Supabase ---
  // Rellena estos dos valores con los de tu proyecto de Supabase:
  // Dashboard → Settings → API → "Project URL" y "anon public" key.
  // La clave "anon" es pública y segura de exponer aquí (no es la service_role).
  const SUPABASE_URL = https://lpslntbqfuqlsrwytrmv.supabase.co/rest/v1/
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxwc2xudGJxZnVxbHNyd3l0cm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMjg2MTMsImV4cCI6MjEwNTkwNDYxM30.UWKrMRtNEhhdA_LuqxEyWoWfsqpRRsYSXCWzMJEzAEs';


  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>

<script>
  const chatEl = document.getElementById('chat');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const notice = document.getElementById('notice');
  const micBtn = document.getElementById('mic');
  const speakToggle = document.getElementById('speakToggle');
  const voiceToggleWrap = document.getElementById('voiceToggle');
  const authScreen = document.getElementById('authScreen');
  const authTitle = document.getElementById('authTitle');
  const authEmail = document.getElementById('authEmail');
  const authPassword = document.getElementById('authPassword');
  const authSubmit = document.getElementById('authSubmit');
  const authError = document.getElementById('authError');
  const authSwitch = document.getElementById('authSwitch');
  const topbar = document.getElementById('topbar');
  const logoutBtn = document.getElementById('logoutBtn');

  let history = [];
  let facts = [];
  let session = null;
  let isSignUp = false;

  authSwitch.addEventListener('click', () => {
    isSignUp = !isSignUp;
    authTitle.textContent = isSignUp ? 'Crea tu cuenta' : 'Inicia sesión';
    authSubmit.textContent = isSignUp ? 'Registrarme' : 'Entrar';
    authSwitch.parentElement.firstChild.textContent = isSignUp ? '¿Ya tienes cuenta? ' : '¿No tienes cuenta? ';
    authSwitch.textContent = isSignUp ? 'Inicia sesión' : 'Regístrate';
    authError.textContent = '';
  });

  authSubmit.addEventListener('click', async () => {
    authError.textContent = '';
    const email = authEmail.value.trim();
    const password = authPassword.value;
    if (!email || password.length < 6) {
      authError.textContent = 'Introduce un email válido y una contraseña de al menos 6 caracteres.';
      return;
    }
    authSubmit.disabled = true;
    const { data, error } = isSignUp
      ? await supabaseClient.auth.signUp({ email, password })
      : await supabaseClient.auth.signInWithPassword({ email, password });
    authSubmit.disabled = false;

    if (error) {
      authError.textContent = error.message;
      return;
    }
    if (isSignUp && !data.session) {
      authError.textContent = 'Cuenta creada. Revisa tu email para confirmar antes de entrar.';
      return;
    }
    session = data.session;
    await onLoggedIn();
  });

  logoutBtn.addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    session = null;
    chatEl.innerHTML = '';
    history = [];
    facts = [];
    chatEl.classList.add('hidden');
    form.classList.add('hidden');
    voiceToggleWrap.classList.add('hidden');
    topbar.classList.add('hidden');
    authScreen.classList.remove('hidden');
  });

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function speak(text) {
    if (!speakToggle.checked || !('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'es-ES';
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function authHeaders() {
    return { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token };
  }

  async function loadMemory() {
    try {
      const resp = await fetch('/api/memory', { headers: authHeaders() });
      const data = await resp.json();
      if (resp.ok) {
        facts = data.facts || [];
        history = data.history || [];
      }
    } catch (e) {}
  }

  async function saveMemory() {
    try {
      await fetch('/api/memory', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ facts, history: history.slice(-30) }),
      });
    } catch (e) {}
  }

  // --- Reconocimiento de voz ---
  let recognition = null;
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognitionCtor) {
    recognition = new SpeechRecognitionCtor();
    recognition.lang = 'es-ES';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onresult = (e) => {
      input.value = e.results[0][0].transcript;
      form.requestSubmit();
    };
    recognition.onend = () => micBtn.classList.remove('listening');
    recognition.onerror = (e) => {
      micBtn.classList.remove('listening');
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        notice.textContent = 'Permiso de micrófono denegado. Revisa los ajustes del sitio en tu navegador.';
      } else if (e.error === 'no-speech') {
        notice.textContent = 'No se detectó voz, inténtalo de nuevo.';
      } else {
        notice.textContent = 'Error de micrófono (' + e.error + ').';
      }
    };
  } else {
    micBtn.style.display = 'none';
  }
  micBtn.addEventListener('click', () => {
    if (!recognition) return;
    micBtn.classList.add('listening');
    try { recognition.start(); } catch (e) { micBtn.classList.remove('listening'); }
  });

  // --- Envío de mensajes ---
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    sendBtn.disabled = true;

    const typingEl = addMessage('typing', 'Pensando...');

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ messages: history, facts }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Error desconocido');

      typingEl.textContent = data.text;
      typingEl.className = 'msg ai';
      history.push({ role: 'assistant', content: data.text });
      speak(data.text);
      await saveMemory();

      if (history.length % 4 === 0) {
        try {
          const fResp = await fetch('/api/extract-facts', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({ messages: history }),
          });
          const fData = await fResp.json();
          if (Array.isArray(fData.facts) && fData.facts.length) {
            facts = fData.facts;
            await saveMemory();
          }
        } catch (e) {}
      }
    } catch (err) {
      typingEl.remove();
      addMessage('ai', 'Ha ocurrido un error al responder: ' + err.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  async function onLoggedIn() {
    authScreen.classList.add('hidden');
    chatEl.classList.remove('hidden');
    form.classList.remove('hidden');
    voiceToggleWrap.classList.remove('hidden');
    topbar.classList.remove('hidden');

    await loadMemory();
    if (history.length) {
      history.forEach((m) => addMessage(m.role === 'user' ? 'user' : 'ai', m.content));
      addMessage('ai', 'Sigo aquí, ¿en qué seguimos?');
    } else {
      addMessage('ai', '¡Hola! Soy tu IA personal. Cuéntame algo sobre ti para empezar a personalizar nuestras conversaciones.');
    }
  }

  // Recupera sesión existente al recargar la página
  supabaseClient.auth.getSession().then(async ({ data }) => {
    if (data.session) {
      session = data.session;
      await onLoggedIn();
    }
  });
</script>
</body>
</html>
